<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon's Knight - Lobby</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
    
    <!-- Notification Bell for Lobby -->
    <button id="btn-notification" style="position: fixed; top: 16px; right: 24px; z-index: 999; background: #0f172a; border: 1px solid #334155; border-radius: 4px; padding: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
        <span style="font-size: 18px;">🔔</span>
        <span id="notif-badge" style="display: none; position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; font-size: 10px; font-weight: bold; border-radius: 50%; width: 16px; height: 16px; line-height: 16px; text-align: center;">0</span>
    </button>

    <div class="game-container">
        <!-- 로그인 뷰 -->
        <section id="login-view" style="display: block; padding-top: 30px;">
            <div style="text-align: center; margin: 0 24px 20px 24px;">
                <img src="images/title.png" alt="Dragon's Knight" style="width: 100%; max-width: 400px; height: auto; display: block; margin: 0 auto; filter: drop-shadow(0 8px 12px rgba(0,0,0,0.6));">
            </div>
            <div class="content-box" style="text-align: center; padding: 32px 20px; margin: 0 24px;">
                <h2 style="margin-bottom: 20px; color: #94a3b8; font-size: 16px;">Firebase 서버 연동</h2>
                <button class="action-btn" id="btn-login" style="width: 80%; padding: 12px; font-size: 16px; border-color: #3b82f6; color: #93c5fd; background-color: #1e293b; display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0 auto;">
                    <svg width="24" height="24" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"></path><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"></path><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"></path><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"></path></svg>
                    Google 계정으로 로그인
                </button>
            </div>
            
            <!-- 백업 및 복구 영역 -->
            <div style="text-align: center; margin: 24px 24px 0 24px; padding-top: 16px; border-top: 1px solid #334155;">
                <p style="color: #64748b; font-size: 12px; margin-bottom: 12px;">로컬 데이터 백업 및 복구</p>
                <div style="display: flex; gap: 8px; justify-content: center;">
                    <button class="action-btn" id="btn-backup" style="padding: 6px 12px; font-size: 12px; width: auto;">데이터 백업 (다운로드)</button>
                    <button class="action-btn" id="btn-restore-trigger" style="padding: 6px 12px; font-size: 12px; width: auto; border-color: #f59e0b; color: #fcd34d;">데이터 복구 (불러오기)</button>
                    <input type="file" id="input-restore-file" accept=".json" style="display: none;">
                </div>
            </div>
        </section>

        <!-- 캐릭터 선택 뷰 -->
        <section id="char-select-view" style="display: none; padding-top: 20px; margin: 0 24px;">
            <h1 style="text-align: center; margin-bottom: 24px; color: #f8fafc; font-size: 24px;">캐릭터 선택</h1>
            <div id="char-slot-container" style="display: flex; flex-direction: column; gap: 16px;">
                <!-- js/auth/auth.js에서 동적으로 3개의 슬롯 렌더링 -->
            </div>
            <div style="text-align: center; margin-top: 24px;">
                <button class="action-btn" id="btn-logout" style="border-color: #ef4444; color: #fca5a5;">로그아웃</button>
            </div>
        </section>

        <!-- 캐릭터 생성 뷰 -->
        <section id="char-create-view" style="display: none; padding-top: 20px; margin: 0 24px;">
            <h1 style="text-align: center; margin-bottom: 24px; color: #f8fafc; font-size: 24px;">새 캐릭터 생성</h1>
            <div class="content-box">
                <div style="margin-bottom: 16px;">
                    <label style="display: block; color: #94a3b8; font-size: 14px; margin-bottom: 8px;">캐릭터 이름</label>
                    <input type="text" id="create-char-name" placeholder="중복 불가능" style="padding: 12px; width: 100%; background: #0f172a; border: 1px solid #334155; color: #f8fafc; border-radius: 4px; outline: none; box-sizing: border-box;">
                </div>
                
                <div style="margin-bottom: 16px;">
                    <label style="display: block; color: #94a3b8; font-size: 14px; margin-bottom: 8px;">성별</label>
                    <div style="display: flex; gap: 8px;">
                        <button class="action-btn active" id="btn-gender-male" style="flex: 1; border-color: #3b82f6; color: #93c5fd;">남성</button>
                        <button class="action-btn" id="btn-gender-female" style="flex: 1;">여성</button>
                    </div>
                </div>

                <div style="margin-bottom: 24px;">
                    <label style="display: block; color: #94a3b8; font-size: 14px; margin-bottom: 8px;">생김새 타입</label>
                    <div style="text-align: center; margin-bottom: 16px;">
                        <img id="appearance-preview" src="images/presets/m_01.png" alt="캐릭터 외형" style="width: 120px; height: 120px; border-radius: 50%; border: 3px solid #3b82f6; box-shadow: 0 4px 10px rgba(0,0,0,0.5); object-fit: cover; transition: all 0.3s ease; display: inline-block;">
                    </div>
                    <div style="display: flex; align-items: center; justify-content: space-between; background: #0f172a; border: 1px solid #334155; border-radius: 4px; padding: 12px;">
                        <button id="btn-appearance-prev" style="background: transparent; border: none; color: #f8fafc; font-size: 20px; cursor: pointer;">◀</button>
                        <div id="appearance-display" style="color: #f8fafc; font-size: 16px; font-weight: 600;">타입 1</div>
                        <button id="btn-appearance-next" style="background: transparent; border: none; color: #f8fafc; font-size: 20px; cursor: pointer;">▶</button>
                    </div>
                </div>

                <div style="display: flex; gap: 8px;">
                    <button class="action-btn" id="btn-create-submit" style="flex: 2; border-color: #10b981; color: #6ee7b7;">생성 완료</button>
                    <button class="action-btn" id="btn-create-cancel" style="flex: 1; border-color: #64748b; color: #cbd5e1;">취소</button>
                </div>
            </div>
        </section>
    </div>
    
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <!-- Data DB -->
    <script src="js/data/items.js?v=2"></script>
    <script src="js/data/jobs.js?v=2"></script>
    <script src="js/data/skills.js?v=2"></script>
    <script src="js/core/npc.js?v=2"></script>
    
    <!-- Core & Auth Logic -->
    <script src="js/core/firebase-init.js?v=2"></script>
    <script src="js/core/db.js?v=2"></script>
    <script src="js/core/models.js?v=2"></script>
    <script src="js/auth/auth.js?v=2"></script>

    <!-- Custom Toast & Notification UI -->
    <div id="toast-container" style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none;"></div>
    
    <div id="custom-confirm-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 10000; justify-content: center; align-items: center;">
        <div style="background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 24px; max-width: 320px; width: 90%; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
            <p id="custom-confirm-msg" style="color: #f8fafc; font-size: 15px; margin-bottom: 24px; line-height: 1.5;"></p>
            <div style="display: flex; gap: 12px; justify-content: center;">
                <button class="action-btn" id="btn-confirm-yes" style="flex: 1; border-color: #3b82f6; color: #93c5fd;">확인</button>
                <button class="action-btn" id="btn-confirm-no" style="flex: 1; border-color: #64748b; color: #cbd5e1;">취소</button>
            </div>
        </div>
    </div>

    <div id="notification-center-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 9998;">
        <div style="position: absolute; top: 60px; right: 24px; background: #0f172a; border: 1px solid #3b82f6; border-radius: 8px; width: 300px; max-height: 400px; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
            <div style="padding: 12px 16px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center;">
                <h3 style="color: #f8fafc; font-size: 14px; margin: 0;">알림 센터</h3>
                <button id="btn-close-notif" style="background: transparent; border: none; color: #94a3b8; cursor: pointer; font-size: 16px;">✕</button>
            </div>
            <div id="notification-list" style="padding: 12px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: #cbd5e1;">
                <div style="text-align: center; color: #64748b; padding: 20px 0;">최근 알림이 없습니다.</div>
            </div>
        </div>
    </div>

</body>
</html>
